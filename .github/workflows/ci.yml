name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-gcc-13
            os: ubuntu-24.04
            cxx: g++-13
          - name: ubuntu-gcc-14
            os: ubuntu-24.04
            cxx: g++-14
          - name: ubuntu-gcc-14-asan-ubsan
            os: ubuntu-24.04
            cxx: g++-14
            sanitize: true
          - name: macos-apple-clang
            os: macos-latest
            cxx: clang++
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libcurl4-openssl-dev g++-13 g++-14

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.sanitize && 'Debug' || 'RelWithDebInfo' }}
          -DGEMINI_WERROR=ON
          -DGEMINI_SANITIZE=${{ matrix.sanitize && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests and benchmark self-check
        run: ctest --test-dir build --output-on-failure --parallel 4

      - name: Reference solutions pass under sanitizers
        run: ./build/gemini-cpp eval --reference --sanitize --jobs 4

      - name: End-to-end against mock Gemini server
        env:
          GEMINI_API_KEY: ci-dummy-key
          GEMINI_BASE_URL: http://127.0.0.1:8765/v1beta
        run: |
          python3 scripts/mock_gemini.py --port 8765 --tasks tasks --buggy-task lru-cache &
          for i in $(seq 1 20); do curl -s -o /dev/null http://127.0.0.1:8765/ && break; sleep 0.5; done
          ./build/gemini-cpp ask "hello from CI" | grep -q "mock reply to: hello from CI"
          ./build/gemini-cpp ask --no-stream "unary" | grep -q "mock reply to: unary"
          test "$(./build/gemini-cpp tokens one two three)" = "3"
          ./build/gemini-cpp models | grep -q mock-gemini
          ./build/gemini-cpp eval --jobs 3 --repair 1 --report-json report.json --report-md report.md
          python3 -c "import json,sys; s=json.load(open('report.json'))['summary']; print(s); sys.exit(0 if s['passed']==6 and s['passed_first_try']==5 else 1)"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (runs the test suite inside)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: gemini-cpp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test image
        run: |
          docker run --rm gemini-cpp:ci --version
          docker run --rm --network none gemini-cpp:ci eval --reference --jobs 2
